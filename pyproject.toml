# DSO 576 shared Python environment
# Shared environment for all repos in this course folder.
[project]
name = "dso576-shared"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "streamlit>=1.30",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "seaborn>=0.13",
    "altair>=5.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "ipykernel>=6.29"
]

[tool.uv]
package = false

# BEGIN DSO 576 workspace members
[tool.uv.workspace]
members = ["00-setup", "02-trace*"]
# END DSO 576 workspace members
